{{- if .Values.global.networkPolicy.enabled }}
# Default deny: pods in this release accept traffic only from other pods in the release.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
---
# The ingress controller may reach only the gateway and the frontend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-ingress-controller
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      # Must match the labels the gateway and frontend charts actually set (`app`), or this
      # policy selects no pod and the default deny keeps the ingress controller out.
      - key: app
        operator: In
        values: ["api-gateway", "ledgerline-frontend"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.networkPolicy.ingressNamespace }}
{{- end }}
