    limits:
      cpu: 500m
      memory: 384Mi

account-service:
  replicaCount: 1
  image:
    repository: ledgerline-account-service
    tag: latest
  usesDb: true
  dbName: ledgerline_account
  usesRedis: true
  usesKafka: true
  resources:
