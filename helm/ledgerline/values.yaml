  usesDb: true
  dbName: ledgerline_audit
  usesRedis: false
  usesKafka: true
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi

reporting-service:
  replicaCount: 1
  image:
    repository: ledgerline-reporting-service
    tag: latest
  usesDb: true
  dbName: ledgerline_reporting
  usesRedis: false
  usesKafka: true
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi

frontend:
