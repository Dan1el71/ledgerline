    tag: latest
  usesDb: true
  dbName: ledgerline_transaction
  usesRedis: false
  usesKafka: true
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi

notification-service:
  replicaCount: 1
  image:
    repository: ledgerline-notification-service
    tag: latest
  usesDb: true
  dbName: ledgerline_notification
  usesRedis: false
  usesKafka: true
  resources:
    requests:
