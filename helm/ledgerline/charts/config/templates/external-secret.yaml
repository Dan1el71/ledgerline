{{- if .Values.global.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ledgerline-secrets
  labels:
    app.kubernetes.io/part-of: ledgerline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.global.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: ledgerline-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: ledgerline/db-credentials
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: ledgerline/db-credentials
        property: password
    - secretKey: POSTGRES_USER
      remoteRef:
        key: ledgerline/db-credentials
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: ledgerline/db-credentials
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: ledgerline/jwt-secret
        property: secret
    - secretKey: INTERNAL_JWT_SECRET
      remoteRef:
        key: ledgerline/internal-jwt-secret
        property: secret
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: ledgerline/redis-password
        property: secret
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: ledgerline/anthropic-api-key
        property: secret
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: ledgerline/openai-api-key
        property: secret
    - secretKey: DEEPGRAM_API_KEY
      remoteRef:
        key: ledgerline/deepgram-api-key
        property: secret
    - secretKey: AUTH_BOOTSTRAP_ADMIN_PASSWORD
      remoteRef:
        key: ledgerline/auth-bootstrap
        property: admin-password
{{- end }}
