replicaCount: 1
image:
  repository: ledgerline-client
  tag: latest
port: 3000
servicePort: 80
# Internal address the Next.js route handlers (BFF) use to reach the gateway.
# The browser never calls this URL directly.
apiUrl: http://api-gateway:8080
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
