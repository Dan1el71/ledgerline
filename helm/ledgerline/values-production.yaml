# Production overrides: managed AWS services, no in-cluster infra
global:
  imageRegistry: "${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com"
  imagePullPolicy: Always
  eureka:
    url: http://eureka:eureka@discovery-service:8761/eureka/
  redis:
    host: ledgerline-redis.xxxxx.us-east-1.cache.amazonaws.com
    port: "6379"
  kafka:
    # TLS listener (port 9094); MSK rejects plaintext clients.
    bootstrapServers: b-1.ledgerline.xxxxx.kafka.us-east-1.amazonaws.com:9094
    securityProtocol: SSL
  postgres:
    host: ledgerline-db.xxxxx.us-east-1.rds.amazonaws.com
    port: "5432"
    username: ledgerline
    password: ""  # Injected via ExternalSecret
  jwt:
    secret: ""  # Injected via ExternalSecret
  jvmOpts: "-Xmx384m -Xms192m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -Xss512k -XX:+UseG1GC"
  externalSecrets:
    enabled: true
    secretStoreRef: aws-secrets-manager
  auth:
    bootstrapEnabled: "false"
    bootstrapAdminEmail: ""
    bootstrapAdminPassword: ""

# Disable in-cluster infrastructure
postgres:
  enabled: false

redis:
  enabled: false

kafka:
  enabled: false

# Production resource tuning
discovery-service:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

