frontend:
  replicaCount: 2
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
    hosts:
      - host: ledgerline.example.com
        paths:
          - path: /api
            pathType: Prefix
            serviceName: api-gateway
            servicePort: 8080
          - path: /
            pathType: Prefix
            serviceName: ledgerline-frontend
            servicePort: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
